[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multibuild"
version = "0.7.0"
description = "speed up operations during release process"
readme = "README.md"
requires-python = ">=3.6"
license = "GPL-3.0-or-later"
authors = [
    {name = "Ondřej Nosek", email = "onosek@redhat.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "argcomplete",
    "platformdirs",
    # "python3-koji",
    # "git",
    # "rhpkg",
    # "fedpkg",
    # "brewkoji",
    # "jq",
]

[project.urls]
Homepage = "https://github.com/onosek/multibuild"

[project.scripts]
multibuild = "multibuild.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["multibuild"]

[tool.hatch.build.targets.sdist]
include = [
    "/multibuild",
    "/README.md",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Enable flake8-like checks
select = ["E", "F", "W"]
